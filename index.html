<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Video</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    .video-container {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 3%;
    }

    video {
      width: 100%;
      height: 100%;
      max-width: 1400px;
      max-height: 90vh;
      object-fit: contain;
      display: block;
    }
  </style>

</head>

<body>

  <div class="video-container">
    <video
      src="video.mp4"
      autoplay
      muted
      loop
      playsinline
      controls>
    </video>
  </div>

</body>
</html>
